<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="509" viewBox="0 0 1230 509" role="img" aria-labelledby="title desc"><title id="title">Colisão do glider P4 com o flipper P2</title><desc id="desc">Na geração 38 as duas peças desapareceram na simulação conjunta. Isoladas, as duas continuam vivas. Nenhuma morte individual gerou um crédito por interferência direta.</desc><rect width="100%" height="100%" rx="12" fill="#13222c"/><style>text{font-family:system-ui,sans-serif}</style><text x="23" y="29" fill="#88dec2" font-size="11" font-weight="700">HEXOPHAGE   /   COLISÃO NA ESFERA F256</text><text x="23" y="62" fill="#e6eff2" font-size="26" font-weight="650">Um disparo elimina as duas peças e registra zero mortes diretas</text><text x="23" y="90" fill="#abbcc4" font-size="15" font-weight="450">Mesmas posições iniciais. A linha de cima reúne as duas execuções isoladas. A de baixo mostra o encontro real.</text><text x="153" y="118" fill="#e6eff2" font-size="15" font-weight="630">G0 · lançamento</text><text x="21" y="180" fill="#e6eff2" font-size="18" font-weight="630">Isolados</text><text x="21" y="204" fill="#abbcc4" font-size="14" font-weight="450">dois campos</text><rect x="153" y="130" width="253" height="130" rx="7" fill="#1b2d39" stroke="#445a66"/><polygon fill="#ff9675" points="198.1,159.7 193.2,162.5 188.3,159.7 188.3,154.1 193.2,151.3 198.1,154.1"/><polygon fill="#ff9675" points="203.4,168.9 198.5,171.7 193.6,168.9 193.6,163.3 198.5,160.4 203.4,163.3"/><polygon fill="#ff9675" points="166.3,178.0 161.4,180.9 156.5,178.0 156.5,172.4 161.4,169.6 166.3,172.4"/><polygon fill="#ff9675" points="198.1,178.0 193.2,180.9 188.3,178.0 188.3,172.4 193.2,169.6 198.1,172.4"/><polygon fill="#ff9675" points="192.8,187.2 187.9,190.0 183.0,187.2 183.0,181.6 187.9,178.8 192.8,181.6"/><polygon fill="#ff9675" points="187.5,196.4 182.6,199.2 177.7,196.4 177.7,190.8 182.6,188.0 187.5,190.8"/><polygon fill="#72ddb5" points="388.9,196.4 384.0,199.2 379.1,196.4 379.1,190.8 384.0,