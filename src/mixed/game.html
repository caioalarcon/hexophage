<template id="mx-panel-template">
 <section class="mx-console">
  <div class="mx-mode"><label for="hl-rulechoice">Autômato da partida</label><span id="mx-mode-slot"></span></div>
  <div class="mx-actions" id="mx-actions"><button id="mx-config" type="button" aria-label="Configurar partida" title="Configurar partida">⚙</button></div>
  <div class="mx-metrics"><div><small>RESERVA</small><strong id="mx-cash"></strong></div><div><small>CAMPO</small><strong id="mx-field"></strong></div><div><small title="Média recente da renda menos nascimentos e cortes">FLUXO / G</small><strong id="mx-flow"></strong></div></div>
  <div class="mx-speed" id="mx-speed-slot"></div>
  <div class="mx-rail-links"><button id="mx-profile-button" type="button" title="Ajustes econômicos da partida"></button><button id="mx-globe" type="button">Globo</button></div>
  <details id="mx-league" open><summary>Classificação</summary><ol id="mx-score"></ol></details>
  <details id="mx-conflicts"><summary>Disputas em campo</summary><div id="mx-event">Avance para observar.</div><button id="mx-locate" type="button" hidden>Ver no mapa</button></details>
 </section>
 <aside class="mx-arsenal" aria-label="Carimbos da partida">
  <header><h2>Carimbos <small id="mx-count"></small></h2><button id="mx-atlas" type="button">Atlas ↗</button></header>
  <div class="mx-tools" aria-label="Modificadores do carimbo">
   <div class="mx-current"><strong id="mx-selected"></strong><span id="mx-price"></span></div>
   <div class="mx-tools-row">
    <div class="mx-orientation" aria-label="Orientação do carimbo">
     <canvas id="mx-preview" width="176" height="112" role="img" aria-label="Prévia do carimbo na orientação atual"></canvas>
     <div id="mx-transform"></div>
    </div>
    <div class="mx-policies">
     <label class="mx-interaction" for="mx-resolver">Interação
      <select id="mx-resolver" aria-label="Interação do próximo carimbo">
       <option value="contact" title="Interage com a vizinhança material">Contato</option>
       <option value="guard" title="Guarda apoiada resiste à travessia">Guarda</option>
       <option value="phase" title="Ignora as outras linhagens e paga pelas células adversárias substituídas">Travessia</option>
       <option value="antimatter" title="Acende uma onda B2/S245 financiada pela sua carteira">Antimatéria</option>
      </select>
     </label>
     <div class="mx-vote"><label for="mx-ballot">Voto da linhagem</label><button id="mx-ballot-help" type="button" aria-label="Entender o voto da linhagem" aria-describedby="mx-ballot-tip" aria-expanded="false">?</button><select id="mx-ballot" aria-describedby="mx-ballot-tip"><option value="support">Apoio</option><option value="age">Idade</option><option value="robustness">Robustez</option><option value="geometry">Posição</option></select>
    <div id="mx-ballot-tip" role="tooltip" hidden><strong>Voto da linhagem</strong><p>Na arbitragem Voto do carimbo, cada linhagem que disputa uma célula compara as candidatas pelo seu critério. A decisão combina esses votos.</p><dl><dt>Apoio</dt><dd>Prefere mais vizinhas da mesma linhagem.</dd><dt>Idade</dt><dd>Prefere a maior idade entre as células de apoio. Para uma sobrevivente, usa a idade dela.</dd><dt>Robustez</dt><dd>Prefere a regra que mantém a célula viva sob mais mudanças de uma vizinha.</dd><dt>Posição</dt><dd>Compara as posições de origem por uma ordem reproduzível, calculada com a semente e a geração.</dd></dl><p>O próximo carimbo e suas descendentes herdam a opção escolhida.</p></div>
     </div>
    </div>
   </div>
   <div id="mx-field-tools" role="toolbar" aria-label="Ferramentas do campo">
    <button id="mx-tool-stamp" type="button" aria-label="Carimbo" aria-pressed="true" title="Carimbo (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v6l2 3v4H7v-4l2-3zM5 16h14v4H5z"/></svg></button>
    <button id="mx-tool-erase" type="button" aria-label="Borracha" aria-pressed="false" title="Borracha (B) · arraste para apagar suas células; Shift para mover o mapa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-10 10H6l-4-4zM8 10l7 7M11 20h10"/></svg></button>
    <button id="mx-tool-pick" type="button" aria-label="Conta-gotas" aria-pressed="false" title="Conta-gotas (I) · copiar o padrão mais próximo para este espaço"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7M16 5l3-3 3 3-3 3M15 8 5 18l-3 1 1-3L13 6M5 18l2 2"/></svg></button>
    <label id="mx-erase-control" hidden title="Raio da borracha em espaçamentos entre células"><span>Raio</span><input id="mx-erase-radius" type="range" min="1" max="12" step="1" value="3" aria-label="Raio da borracha"><output id="mx-erase-value" for="mx-erase-radius">3</output></label>
   </div>
  </div>
  <div id="mx-hand" role="group" aria-label="Baralho por relevância econômica"></div>
 </aside>
 <dialog id="mx-settings" aria-labelledby="mx-settings-title">
  <header><h2 id="mx-settings-title">Partida e bots</h2><button type="button" id="mx-settings-close" aria-label="Fechar configurações">×</button></header>
  <form id="mx-setup">
   <fieldset><legend>Partida</legend><label>Esfera<select id="mx-size"></select></label><label>Semente<input type="number" id="mx-seed" min="0" max="4294967295" step="1" required></label><label>Reserva inicial<input type="number" id="mx-bank" min="0" step="any" placeholder="Do perfil"></label></fieldset>
   <fieldset><legend>Bots</legend><label>Intervalo de compra (G)<input type="number" id="mx-bot-interval" min="1" step="1" required></label><label>Passos de pesquisa por G<input type="number" id="mx-bot-budget" min="0" step="1" required></label></fieldset>
   <fieldset><legend>Ferramentas</legend><label>Raio máximo da borracha<input type="number" id="mx-erase-max" min="1" step="1" required></label><label>Máximo de células por carimbo<input type="number" id="mx-stamp-max" min="1" step="1" required></label><button type="button" id="mx-tools-apply" class="mx-wide">Aplicar ferramentas nesta partida</button></fieldset>
   <fieldset><legend>Economia</legend><label class="mx-wide">Gerar energia por<select id="mx-economy"><option value="stability">Células fixas maduras</option><option value="birth">Nascimentos</option><option value="death">Mortes</option><option value="activity">Nascimentos e mortes</option></select></label><div id="mx-tariffs" class="mx-wide"></div></fieldset>
   <fieldset><legend>Colisões</legend><label>Vida ou vazio<select id="mx-existence"><option value="majority">Maioria das linhagens</option><option value="support">Maioria por apoio</option><option value="any">Basta um sim</option><option value="unanimous">Unanimidade</option><option value="legacy">Só propostas positivas</option></select></label><label>Quem ocupa<select id="mx-identity"><option value="ballot">Voto do carimbo</option><option value="ecology">Maioria ecológica</option><option value="support">Apoio local</option><option value="cycle">Ciclo entre interações</option><option value="dominant">Dominante designado</option><option value="majority">Maioria de três critérios</option><option value="fixed">Ordem fixa</option><option value="matrix">Matriz editável</option><option value="phase">Preferência à travessia</option><option value="legacy">Original</option></select></label>
   <div id="mx-families" class="mx-wide" hidden><label>Comparar por<select id="mx-axis"><option value="resolver">Interação</option><option value="rule">Autômato</option></select></label><label id="mx-order-line"><span id="mx-order-label"></span><input id="mx-order" type="text" spellcheck="false"></label><div id="mx-matrix" hidden></div></div>
   <label class="mx-check mx-wide"><input type="checkbox" id="mx-friendly"> Permitir substituição de aliadas sobreviventes</label></fieldset>
   <p id="mx-error" role="alert"></p><footer><button type="submit" class="primary">Nova partida com estes ajustes</button></footer>
  </form>
 </dialog>
 <div id="mx-atlas-host"></div>
</template>
