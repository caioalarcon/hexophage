<div class="hl-controls">
 <button class="primary" id="hl-play"><span aria-hidden="true">▶</span> <span>Iniciar</span></button>
 <button id="hl-clear" hidden title="Parar e limpar a partida" aria-label="Parar e limpar a partida">■<span> Parar</span></button>
 <button id="hl-step">+1 geração</button><button id="hl-seed">Semear</button>
 <div class="br-live-tuning" aria-label="Ajustes ao vivo">
  <div class="br-advanced-tuning" id="br-advanced-tuning">
  <div class="br-knob"><div><label for="br-difficulty">Dificuldade</label><span><input id="br-botturn" aria-label="Gerações entre carimbadas dos bots" title="Intervalo por bot, em gerações" type="number" min="1" max="1000" step="1" value="10"> ger.</span></div><input id="br-difficulty" type="range" min="0" max="120" step="1" title="À direita, os bots carimbam com mais frequência"></div>
  <div class="br-tuning-actions"><button type="button" id="br-menu-step">+1 geração</button><button type="button" id="br-menu-reset">Reiniciar</button></div>
  </div>
  <div class="br-knob br-speed-knob"><div><label for="hl-speed">Velocidade</label><output id="hl-speed-val">200/s</output></div><input id="hl-speed" type="range" min="1" max="400" value="200" step="1"></div>
 </div>
 <button id="br-tuning-toggle" type="button" aria-expanded="false" aria-controls="br-advanced-tuning" title="Velocidade, dificuldade e ações" aria-label="Velocidade e ajustes da simulação">⚙ <span class="br-tuning-label">Ajustes</span><span id="br-mobile-speed">200/s</span></button>
 <button id="br-economy-toggle" type="button" aria-expanded="false" aria-controls="br-energy-panel" title="Configurar os sete parâmetros da economia e o tributo de combate">⚖ Economia</button>
 <button id="br-panel-toggle" class="small" aria-controls="br-sidepanel" aria-expanded="true">Painel</button>
</div>
