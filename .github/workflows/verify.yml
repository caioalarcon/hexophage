name: Verify Hexophage
on:
  push:
    branches: [preview/session-recovery]
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply the locally tested session-recovery patch
        run: |
          gzip -dc scripts/session-recovery.patch.gz > /tmp/session-recovery.patch
          git apply --check /tmp/session-recovery.patch
          git apply /tmp/session-recovery.patch
          rm scripts/session-recovery.patch.gz
          git show bbd88eb1248ee6f3a6eb813c62add1f6291dcda1:.github/workflows/verify.yml > .github/workflows/verify.yml
      - run: npm run build
      - run: git diff --check
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: node tests/mixed-ui-polish.cjs
      - name: Verify the offline economic experiments
        run: |
          node --test "experiments/economy/*.test.js"
          node experiments/economy/build-lab.js
          git diff --exit-code --stat -- experiments/economy/lab.html
          node experiments/economy/lab/browser.test.js
          node experiments/economy/incoming-glider-replay.mjs
      - name: Verify concurrent recovery
        run: node experiments/typed-world/game/concurrent-tool-recovery.mjs
      - name: Commit verified sources and portable distributions
        run: |
          git add -u
          git add experiments/typed-world/action-events.test.mjs experiments/typed-world/game/concurrent-tool-recovery.mjs src/match/controls/playback-state.js src/match/controls/playback-state.test.js tests/mixed-playback.cjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Restore contextual session controls and prevent bot cleanup starvation'
          git push origin HEAD:preview/session-recovery
      - uses: actions/upload-artifact@v4
        with:
          name: hexophage-session-recovery
          path: index.html
