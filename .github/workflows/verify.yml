name: Verify Hexophage
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify the offline economic experiments
        run: |
          node --test "experiments/economy/*.test.js"
          node experiments/economy/build-lab.js
          git diff --exit-code --stat -- experiments/economy/lab.html
          node experiments/economy/lab/browser.test.js
          node experiments/economy/incoming-glider-replay.mjs
      - name: Update only the dev preview HTML after successful checks
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build dev preview from tested features'
            git push origin HEAD:dev
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hexophage-dev
          path: index.html
